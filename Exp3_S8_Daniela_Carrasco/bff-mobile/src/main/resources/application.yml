server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: bff-mobile
  security:
    oauth2:
      resourceserver:
        jwt:
          # Clave publica del auth-server (los tokens se validan localmente)
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank_batch}
    username: ${DB_USER:bank_batch}
    password: ${DB_PASSWORD:bank_batch}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

resilience4j:
  circuitbreaker:
    instances:
      msCuentas:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
      msTransacciones:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    instances:
      msCuentas:
        max-attempts: 3
        wait-duration: 500ms
      msTransacciones:
        max-attempts: 3
        wait-duration: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    com.duocuc.bankbff: INFO
    
# Credenciales OAuth2 (client_credentials) con las que este BFF llama a los ms-*
service-auth:
  token-uri: ${AUTH_TOKEN_URI:http://localhost:9000/oauth2/token}
  client-id: bff-mobile-svc
  client-secret: ${BFF_MOBILE_SVC_SECRET:bff-mobile-svc-cambiar}
  scope: "ms.read ms.write"

backend:
  connect-timeout-ms: 2000
  read-timeout-ms: 3000
  ms-cuentas:
    base-url: http://localhost:8090
  ms-transacciones:
    base-url: http://localhost:8092
  ms-movimientos:
    base-url: http://localhost:8091